<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO Meta Tags -->
  <meta name="description" content="Datt Patel — Senior iOS & Flutter Developer with 3+ years experience. Specializing in Swift, SwiftUI, UIKit, and Flutter. Available for enterprise mobile development, App Store deployment, and consulting.">
  <meta name="keywords" content="iOS Developer, Flutter Developer, Swift, SwiftUI, UIKit, Dart, Mobile Developer, App Store, Firebase, Enterprise Apps, India">
  <meta name="author" content="Datt Patel">
  <meta name="robots" content="index, follow">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://dattpatel.dev/">
  <meta property="og:title" content="Datt Patel — iOS & Flutter Developer">
  <meta property="og:description" content="Senior iOS & Flutter Developer with 3+ years building enterprise mobile applications. Swift · SwiftUI · Flutter · Firebase.">
  <meta property="og:image" content="icons/Icon-512.png">

  <!-- Twitter Card -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://dattpatel.dev/">
  <meta property="twitter:title" content="Datt Patel — iOS & Flutter Developer">
  <meta property="twitter:description" content="Senior iOS & Flutter Developer. Enterprise apps, App Store expert, Swift & Flutter specialist.">
  <meta property="twitter:image" content="icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Datt Patel">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Title -->
  <title>Datt Patel — iOS & Flutter Developer</title>

  <!-- Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Theme Color -->
  <meta name="theme-color" content="#09090B">

  <!-- Preconnect for Google Fonts (loaded by Flutter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Loading screen styles -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #09090B;
      overflow: hidden;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #09090B;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }
    #loading.hide {
      opacity: 0;
      pointer-events: none;
    }
    .loader-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #007AFF;
      animation: bounce 1.2s infinite ease-in-out;
      margin: 0 4px;
    }
    .loader-dot:nth-child(2) { animation-delay: -0.4s; }
    .loader-dot:nth-child(3) { animation-delay: -0.2s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #09090B; }
    ::-webkit-scrollbar-thumb { background: #007AFF; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #0056B3; }
  </style>
</head>
<body>
  <!-- HTML loading indicator (before Flutter loads) -->
  <div id="loading">
    <div class="loader-dot"></div>
    <div class="loader-dot"></div>
    <div class="loader-dot"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Hide HTML loader once Flutter is ready
    window.addEventListener('flutter-first-frame', function() {
      var loader = document.getElementById('loading');
      if (loader) {
        loader.classList.add('hide');
        setTimeout(function() { loader.remove(); }, 600);
      }
    });
  </script>
</body>
</html>
